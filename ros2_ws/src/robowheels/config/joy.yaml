# teleop_twist_joy config for the RDK X5 chassis.
# Gamepad: Xbox 360 compatible controller (/dev/input/js0, verified on the X5).
# Layout: left stick Y = linear.x, right stick X = angular.z,
# RB (button 5) = enable (deadman).  Linear scale 0.3 m/s, angular 2.0 rad/s.
teleop_twist_joy_node:
  ros__parameters:
    axis_linear:
      x: 1          # left stick vertical
    scale_linear:
      x: 0.3
    scale_linear_turbo:
      x: 0.3
    axis_angular:
      yaw: 3        # Xbox right stick horizontal (ABS_RX)
    scale_angular:
      yaw: 2.0
    scale_angular_turbo:
      yaw: 2.0
    enable_button: 5
    enable_turbo_button: -1
    require_enable_button: true
