# teleop_twist_joy config for the RDK X5 chassis.
# Gamepad: DragonRise Inc. Controller (/dev/input/js0, verified on the X5).
# Layout: left stick Y = linear.x, right stick X = angular.z,
# RB (button 5) = enable (deadman).  Linear scale 0.5 m/s, angular 2.0 rad/s.
teleop_twist_joy_node:
  ros__parameters:
    axis_linear:
      x: 1          # left stick vertical
    scale_linear:
      x: 0.5
    scale_linear_turbo: 0.5
    axis_angular:
      yaw: 2        # right stick horizontal
    scale_angular:
      yaw: 2.0
    scale_angular_turbo: 2.0
    enable_button: 5
    enable_turbo_button: -1
    require_enable_button: true
